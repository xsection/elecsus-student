# [ES4] Replaces setup.py: declares a build backend so the package builds under
# PEP 517 (`pip install .`, `python -m build`) rather than relying on pip's
# legacy setup.py path.  The dependency floors below are the versions the code
# is actually developed and tested against, and match environment.yml; the
# setup.py floors they replace (`scipy >= 0.12.0`, `matplotlib >= 1.3.1`) dated
# from 2014 and were satisfied by releases the package no longer runs on.

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ElecSus"
version = "4.0.0b1"
description = "(Atomic Physics) Calculate the weak-probe electric susceptibility for alkali-metal vapours"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.txt"]
# v4 authorship, matching the decision already made on release/v4.0.0a2.
# The full credit list (v1-v3 authors included) is in AUTHORS, CITATION.cff
# and .zenodo.json, which is what citation tooling reads.
authors = [
    {name = "S. A. Wrathmall", email = "s.a.wrathmall@durham.ac.uk"},
    {name = "R. M. Potvliege"},
]
maintainers = [
    {name = "S. A. Wrathmall", email = "s.a.wrathmall@durham.ac.uk"},
]
keywords = ["atomic physics", "spectroscopy", "susceptibility", "alkali metal", "vapour cell"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "lmfit>=1.3.4",     # 1.3+ for numpy 2.x; 1.3.0-1.3.3 warn "UFloat ... std_dev==0" in fits (#106)
    "cycler>=0.11",
]

[project.optional-dependencies]
# Plotly Dash web GUI (elecsus/elecsus_dash_gui.py, exercised by test_gui_*).
gui = [
    "dash>=2.17",
    "dash-bootstrap-components>=1.6",
    "plotly>=5.22",
]
test = [
    "pytest>=8",
    "pytest-cov>=5",
    "dash>=2.17",
    "dash-bootstrap-components>=1.6",
    "plotly>=5.22",
]
# The PDF report generators and the Notebooks/ tutorials.
dev = [
    "reportlab>=4",
    "jupyterlab>=4",
    "notebook>=7",
    "nbconvert>=7",
    # Only needed to regenerate tests/golden/es3_reference.npz with ElecSus 3;
    # no ElecSus 4 code path imports sympy.
    "sympy>=1.12",
]

[project.urls]
Homepage = "https://github.com/durham-qlm/ElecSus"

[tool.setuptools.packages.find]
# Every directory under elecsus/, so the data directories (assets, images,
# sample_data, tests/golden, ...) are packages too and setuptools does not warn
# that it will stop shipping them. (tests/golden is one of them, so its
# generate_es3_reference.py, which documents the reference's provenance, now
# ships with its .npz.)
include = ["elecsus*"]
namespaces = true

[tool.setuptools.package-data]
# Globs rather than the literal filenames setup.py listed, one of which
# ('images/elecsus_group.ico') no longer exists. The logo was also renamed
# elecsus-logo.PNG -> .png (as release/v4.0.0a2 had already done): the old
# setup.py asked for '.png' and so silently dropped it from wheels built on a
# case-sensitive filesystem.
elecsus = [
    "images/*.ico",
    "images/*.png",
    "sample_data/*.csv",
    "sample_data/*.md",
    "tests/golden/*.npz",
    # GUI theme and font, served locally by Dash (see assets/README.md)
    "assets/*.css",
    "assets/*.woff2",
    "assets/*.txt",
    "assets/*.md",
]
